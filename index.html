<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06080c">
<title>看見你的聲音</title>
  <script type="module" crossorigin src="./assets/index--vB6WTgM.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-SfU-Me2t.css">
</head>
<body>
<div id="app" data-task="0">
  <header class="top glass" id="top">
    <span id="stepTxt">看見你的聲音</span>
    <span class="rt"><span id="round"></span><div class="steps"><i data-s="1"></i><i data-s="2"></i><i data-s="3"></i><i data-s="4"></i></div></span>
  </header>
  <section id="stage">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <div id="glotBox"><canvas id="glot"></canvas><span>聲帶 ○ 示意</span></div>
    <div id="note" class="off"><b id="noteName">等你出聲</b><em id="noteZone"></em><small id="noteSub"></small></div>
  </section>
  <div id="instr"></div>
  <section id="panel"></section>
  <section id="sub">
    <div id="readout"><span id="rdl">唱到的範圍</span><b id="rd">等你出聲</b></div>
    <div class="main" id="lanePiano"><canvas></canvas></div>
    <div class="main capt" id="laneZoom"><canvas></canvas><div class="lt"><b>穩定放大鏡</b>線在綠色帶子裡＝很穩</div></div>
    <div class="main" id="scaleBox"><div id="livesc"></div></div>
    <div class="main capt" id="lanePitch"><canvas></canvas><div class="lt"><b>音高線</b>橘色方塊是目標，綠線是你</div></div>
    <div class="lane" id="laneSpec"><canvas></canvas><div class="lt"><b>聲音圖</b>每一條橫線是一個泛音，越亮越強</div></div>
    <div id="cards" hidden></div>
  </section>
  <footer id="dock" class="glass"></footer>
</div>
<div id="sheet" class="sheet"></div>
<div id="diag" aria-hidden="true"></div>
</body>
</html>
