<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06080c">
<title>看見你的聲音</title>
  <script type="module" crossorigin src="./assets/index-D6FwQYxP.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-XxLLzcnF.css">
</head>
<body>
<div id="app">
  <header class="top glass" id="top">
    <span class="brand">看見你的聲音<i id="mic" class="mic" title="麥克風"></i></span>
    <span class="unl" id="unl" aria-label="唱了幾次（唱 3 次就能看總結）"><i></i><i></i><i></i><em id="unlN">0/3 次</em></span>
    <button class="tbtn" id="howBtn" type="button" aria-label="玩法小提示">小提示</button>
  </header>
  <section id="stage">
    <canvas id="gl" aria-label="3D 頭像，可以用手指滑動轉動"></canvas>
    <div id="labels" hidden></div>
    <div id="swipe" class="swipe"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 20h24M8 20l5-5M8 20l5 5M32 20l-5-5M32 20l-5 5M20 8v24M20 8l-5 5M20 8l5 5M20 32l-5-5M20 32l5-5"/></svg><span>手指<b>上下左右滑</b><br>可以轉動頭像</span></div>
    <button class="reset" id="resetCam" type="button">↺ 轉回側面</button>
    <figure id="lxBox"><canvas id="lx"></canvas><figcaption id="lxCap">聲帶示意（慢動作）</figcaption></figure>
  </section>
  <section id="now"><span class="newb" id="newB">新解鎖！</span>
    <div class="type"><b id="tName">等你出聲</b><small id="tPlain">對著手機唱一聲「啊～」就開始</small></div>
    <div class="note"><b id="nName">—</b><small id="nHz"></small></div>
  </section>
  <div id="tip" class="tip"></div>
  <section id="meter" aria-label="聲音類型刻度">
    <div class="m-bar"><div class="z" style="--c:#ff4f7b">真音</div><div class="z" style="--c:#ffad4a">強混</div><div class="z" style="--c:#3ddbc9">平衡混</div><div class="z" style="--c:#5fa8ff">弱混</div><div class="z" style="--c:#8a86ff">頭聲</div><div class="z" style="--c:#b98cff">假音</div><i class="m-dot"></i></div>
    <div class="m-ends"><span>← 厚、像講話</span><span>輕、薄 →</span></div>
  </section>
  <section id="pitch"><div class="lt"><b>音高線</b><span class="hl">↑ 越上面越高</span></div><canvas></canvas></section>
  <section id="spec"><div class="lt"><b>聲音圖</b><span class="hl">每條橫線是一個泛音・越亮越強</span></div><canvas></canvas></section>
  <footer id="dock" class="glass">
    <button class="btn" id="sumBtn" type="button" disabled>唱 3 次（每次 3 秒以上）就能看總結</button>
  </footer>
</div>
<div id="sheet" class="sheet"></div>
<div id="diag" aria-hidden="true"></div>
</body>
</html>
